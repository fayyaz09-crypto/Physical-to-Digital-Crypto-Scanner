<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical to Digital Crypto Scanner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #131722;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #1e232d;
        }
        
        /* Logo & Header Styling */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e232d;
        }
        
        .site-logo {
            width: 60px;
            height: 60px;
        }
        
        .title-area {
            text-align: left;
        }
        
        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        h1 span {
            color: #00ff88;
        }
        
        .subtitle {
            color: #2979ff;
            font-size: 13px;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #1e232d;
        }
        th {
            background-color: #1a202c;
            color: #2979ff;
            font-size: 14px;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #1a2233;
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
        .oversold {
            background-color: #00ff88;
            color: #000;
        }
        .overbought {
            background-color: #ff3366;
            color: #fff;
        }
        .neutral {
            background-color: #4a5568;
            color: white;
        }
        .bullish {
            color: #00ff88;
            font-weight: bold;
        }
        .bearish {
            color: #ff3366;
            font-weight: bold;
        }
        
        .refresh-btn {
            display: block;
            width: 200px;
            margin: 25px auto 0 auto;
            padding: 12px;
            background: linear-gradient(135deg, #2979ff, #00ff88);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s;
            font-weight: bold;
        }
        .refresh-btn:hover {
            opacity: 0.9;
        }
        .loading {
            text-align: center;
            color: #00ff88;
            margin-top: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <!-- Blue & Neon Green Professional Logo -->
        <svg class="site-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" stroke="#2979FF" stroke-width="4" fill="#131722"/>
            <circle cx="50" cy="50" r="36" stroke="#00FF88" stroke-width="2" stroke-dasharray="6 4"/>
            <path d="M30 65 L45 45 L55 55 L72 32" stroke="#00FF88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M62 32 H72 V42" stroke="#00FF88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="30" cy="65" r="4" fill="#2979FF"/>
            <circle cx="45" cy="45" r="4" fill="#2979FF"/>
            <circle cx="55" cy="55" r="4" fill="#2979FF"/>
            <circle cx="72" cy="32" r="4" fill="#00FF88"/>
        </svg>
        
        <div class="title-area">
            <h1>PHYSICAL TO DIGITAL <span>CRYPTO SCANNER</span></h1>
            <div class="subtitle">REAL-TIME MARKET ANALYSIS & INDICATORS</div>
        </div>
    </div>
    
    <div id="loadingStatus" class="loading">Analyzing live crypto market... Please wait.</div>

    <table id="scannerTable" style="display: none;">
        <thead>
            <tr>
                <th>Coin Pair</th>
                <th>Price (USDT)</th>
                <th>RSI (14)</th>
                <th>RSI Signal</th>
                <th>Trend (EMA 20/50)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <button class="refresh-btn" onclick="loadMarketData()">Refresh Scanner</button>
</div>

<script>
    const symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT', 'ADAUSDT', 'XRPUSDT', 'AVAXUSDT', 'LINKUSDT', 'DOTUSDT', 'NEARUSDT'];

    function calculateRSI(closes, period = 14) {
        if (closes.length < period + 1) return 50;
        let gains = 0, losses = 0;
        for (let i = closes.length - period; i < closes.length; i++) {
            let change = closes[i] - closes[i - 1];
            if (change > 0) gains += change;
            else losses -= change;
        }
        let avgGain = gains / period, avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        let rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
    }

    function calculateEMA(closes, period) {
        if (closes.length < period) return closes[closes.length - 1];
        let k = 2 / (period + 1), ema = closes[0];
        for (let i = 1; i < closes.length; i++) {
            ema = (closes[i] * k) + (ema * (1 - k));
        }
        return ema;
    }

    async function fetchKlines(symbol) {
        try {
            const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=100`);
            const data = await response.json();
            return data.map(candle => parseFloat(candle[4]));
        } catch (error) {
            console.error(`Error fetching data for ${symbol}:`, error);
            return [];
        }
    }

    async function loadMarketData() {
        const tableBody = document.getElementById('tableBody');
        const loadingStatus = document.getElementById('loadingStatus');
        const scannerTable = document.getElementById('scannerTable');
        
        loadingStatus.style.display = 'block';
        scannerTable.style.display = 'none';
        tableBody.innerHTML = '';

        for (let symbol of symbols) {
            const closes = await fetchKlines(symbol);
            if (closes.length > 50) {
                const currentPrice = closes[closes.length - 1];
                const rsi = calculateRSI(closes, 14);
                const ema20 = calculateEMA(closes, 20);
                const ema50 = calculateEMA(closes, 50);

                let rsiClass = 'neutral', rsiText = 'Neutral';
                if (rsi < 30) { rsiClass = 'oversold'; rsiText = 'Oversold (<30)'; }
                else if (rsi > 70) { rsiClass = 'overbought'; rsiText = 'Overbought (>70)'; }

                let trendText = ema20 > ema50 ? 'BULLISH' : 'BEARISH';
                let trendClass = ema20 > ema50 ? 'bullish' : 'bearish';
                const formattedPrice = currentPrice >= 1 ? currentPrice.toFixed(2) : currentPrice.toFixed(6);

                const row = `<tr>
                    <td><strong>${symbol.replace('USDT', '')}/USDT</strong></td>
                    <td>$${formattedPrice}</td>
                    <td>${rsi.toFixed(2)}</td>
                    <td><span class="badge ${rsiClass}">${rsiText}</span></td>
                    <td><span class="${trendClass}">${trendText}</span></td>
                </tr>`;
                tableBody.innerHTML += row;
            }
        }

        loadingStatus.style.display = 'none';
        scannerTable.style.display = 'table';
    }

    loadMarketData();
</script>

</body>
</html>
